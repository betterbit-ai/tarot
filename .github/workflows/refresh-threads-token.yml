name: Refresh Threads token

on:
  workflow_dispatch:
  schedule:
    # 09:05 Asia/Seoul = 00:05 UTC. Korea has no daylight saving time.
    - cron: "5 0 * * *"

permissions:
  contents: read

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CONTENT_SCHEDULER_SECRET: ${{ secrets.CONTENT_SCHEDULER_SECRET }}
      VERCEL_GROWTH_BASE_URL: ${{ vars.VERCEL_GROWTH_BASE_URL }}
    steps:
      - name: Trigger the protected Vercel token refresh
        run: |
          if [ -z "$CONTENT_SCHEDULER_SECRET" ] || [ -z "$VERCEL_GROWTH_BASE_URL" ]; then
            echo "Vercel token-refresh settings are incomplete; no refresh was attempted."
            exit 0
          fi
          response_file="$(mktemp)"
          http_status="$(curl --silent --show-error --max-time 25 \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST "$VERCEL_GROWTH_BASE_URL/api/content/refresh-token" \
            --header "x-mr-tarot-scheduler: $CONTENT_SCHEDULER_SECRET" \
            --header "content-type: application/json")"
          echo "Vercel token-refresh HTTP status: $http_status"
          sed -E 's/(accessToken|token|secret|authorization)[^,}]*/\1=[redacted]/gi' "$response_file"
          if [ "$http_status" -ge 400 ]; then
            exit 22
          fi
