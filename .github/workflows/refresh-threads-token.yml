name: Refresh Threads token

on:
  workflow_dispatch:
  schedule:
    # 09:05 Asia/Seoul = 00:05 UTC. Korea has no daylight saving time.
    - cron: "5 0 * * *"

permissions:
  contents: read

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GROWTH_SCHEDULER_SECRET: ${{ secrets.GROWTH_SCHEDULER_SECRET }}
      VERCEL_GROWTH_BASE_URL: ${{ vars.VERCEL_GROWTH_BASE_URL }}
    steps:
      - name: Trigger the protected Vercel token refresh
        run: |
          if [ -z "$GROWTH_SCHEDULER_SECRET" ] || [ -z "$VERCEL_GROWTH_BASE_URL" ]; then
            echo "Vercel token-refresh settings are incomplete; no refresh was attempted."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 25 \
            --request POST "$VERCEL_GROWTH_BASE_URL/api/content/refresh-token" \
            --header "x-mr-tarot-scheduler: $GROWTH_SCHEDULER_SECRET" \
            --header "content-type: application/json"
