name: Sync Threads metrics

on:
  workflow_dispatch:
  schedule:
    # 23:30 Asia/Seoul = 14:30 UTC, after the 22:00 publishing window.
    - cron: "30 14 * * *"

permissions:
  contents: read

jobs:
  sync-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CONTENT_SCHEDULER_SECRET: ${{ secrets.CONTENT_SCHEDULER_SECRET }}
      VERCEL_GROWTH_BASE_URL: ${{ vars.VERCEL_GROWTH_BASE_URL }}
    steps:
      - name: Trigger the protected Vercel metrics sync
        run: |
          if [ -z "$CONTENT_SCHEDULER_SECRET" ] || [ -z "$VERCEL_GROWTH_BASE_URL" ]; then
            echo "Vercel metrics settings are incomplete; no sync was attempted."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 25 \
            --request POST "$VERCEL_GROWTH_BASE_URL/api/content/sync-metrics" \
            --header "x-mr-tarot-scheduler: $CONTENT_SCHEDULER_SECRET" \
            --header "content-type: application/json"
