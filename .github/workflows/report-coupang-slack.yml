name: Send Coupang daily report to Slack

on:
  workflow_dispatch:
  schedule:
    # 15:10 Asia/Seoul = 06:10 UTC, after Coupang's stated 15:00 daily update.
    - cron: "10 6 * * *"

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CONTENT_SCHEDULER_SECRET: ${{ secrets.CONTENT_SCHEDULER_SECRET }}
      VERCEL_GROWTH_BASE_URL: ${{ vars.VERCEL_GROWTH_BASE_URL }}
    steps:
      - name: Trigger the protected Coupang Slack report
        run: |
          if [ -z "$CONTENT_SCHEDULER_SECRET" ] || [ -z "$VERCEL_GROWTH_BASE_URL" ]; then
            echo "Coupang report scheduler settings are incomplete; no report was sent."
            exit 1
          fi
          response_file="$(mktemp)"
          http_status="$(curl --silent --show-error --max-time 55 \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST "$VERCEL_GROWTH_BASE_URL/api/affiliate/report-slack" \
            --header "x-mr-tarot-scheduler: $CONTENT_SCHEDULER_SECRET" \
            --header "content-type: application/json")"
          echo "Coupang Slack report HTTP status: $http_status"
          sed -E 's/(accessKey|secretKey|webhook|token|authorization)[^,}]*/\1=[redacted]/gi' "$response_file"
          if [ "$http_status" -ge 400 ]; then
            exit 22
          fi
          mode="$(grep -oE '"mode":"[^"]+"' "$response_file" | head -n 1 || true)"
          if [ "$mode" != '"mode":"sent"' ] && [ "$mode" != '"mode":"already-sent"' ]; then
            echo "Unexpected report result: ${mode:-missing mode}"
            exit 23
          fi
